{% load i18n %}
{# Interactive multi-city route line. Expects `stops` (ordered TourStop list). #}
<div class="route-line" data-stops="{{ stops|length }}">
  {% for stop in stops %}
    <button type="button" class="route-stop" data-city-slug="{{ stop.city.slug }}" data-stop-index="{{ forloop.counter0 }}">
      <span class="route-stop-dot"></span>
      <span class="route-stop-label">{{ stop.city.name }}</span>
      <span class="route-stop-nights">{{ stop.nights }} {% blocktrans count nights=stop.nights %}night{% plural %}nights{% endblocktrans %}</span>
    </button>
    {% if not forloop.last %}<span class="route-connector"></span>{% endif %}
  {% endfor %}
</div>

<div id="city-detail-panel" class="city-detail-panel" hidden>
  {# populated dynamically when a stop is clicked #}
</div>
